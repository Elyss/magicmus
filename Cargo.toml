[package]
name = "karaoke"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
rfd = "0.18.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.1"
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug", "Win32_Foundation", "Win32_System_Kernel"], optional = true }
zip = "9.5.0"

[build-dependencies]
cc = "1.11.1"
winresource = "0.1.34"

[features]
# Écrans de démonstration et diagnostic des plantages (MAGICMUS_DEMO=traitement | correction | resynchro | bibliotheque | historique).
demo = ["dep:windows-sys"]
